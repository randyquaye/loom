name: Loom
options:
  bundleIdPrefix: dev.loom.app
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Loom:
    type: application
    platform: iOS
    sources:
      - path: Loom
    info:
      path: Loom/Info.plist
      properties:
        CFBundleDisplayName: Loom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The sign-in callback is dev.loom.app.ios:/oauth/callback, in the desktop app's dev.loom.app
        # namespace. It is consumed only inside the system authentication session that started it;
        # the app has no handler for opened URLs.
        CFBundleURLTypes:
          - CFBundleURLName: dev.loom.app.ios.oauth
            CFBundleTypeRole: None
            CFBundleURLSchemes:
              - dev.loom.app.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loom.app.ios
        PRODUCT_NAME: Loom
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  LoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoomTests
      - path: ../contracts/trust-fixture.json
        buildPhase: resources
    dependencies:
      - target: Loom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.loom.app.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Loom.app/Loom
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Loom:
    build:
      targets:
        Loom: all
        LoomTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LoomTests
    archive:
      config: Release
