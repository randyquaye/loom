name: Release runner
on:
  workflow_dispatch:
    inputs:
      version:
        description: Runner version (X.Y.Z)
        required: true
        type: string
      desktop_tag:
        description: Existing immutable compatible desktop-vX.Y.Z release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: runner-release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      DESKTOP_TAG: ${{ inputs.desktop_tag }}
    steps:
      - name: Require main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs inspect runner "$VERSION"
      - name: Install
        run: |
          npm install --global pnpm@11.7.0
          pnpm install --frozen-lockfile
      - name: Check source and build
        run: |
          pnpm typecheck
          pnpm lint
          npm rebuild better-sqlite3 node-pty
          pnpm test
          pnpm build
      - name: Bind desktop and package runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs runner "$VERSION" "$DESKTOP_TAG" release/runner
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-release
          if-no-files-found: error
          retention-days: 7
          path: |
            release/runner/runner.json
            release/runner/*.tgz
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runner-release
          path: release/runner
      - run: node scripts/release.mjs publish runner "$VERSION" release/runner
